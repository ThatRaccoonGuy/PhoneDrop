<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="referrer" content="no-referrer">
<title>PhoneDrop — send files</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/guest.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="brand"><img src="/static/icon.svg" alt=""><span>PhoneDrop</span></div>
</header>

<main>
  <section id="drop" class="drop">
    <input id="picker" type="file" accept="image/*,video/*" multiple hidden>
    <input id="pickerAny" type="file" multiple hidden>
    <div class="pick-row">
      <button id="pick" class="primary big">Send photos &amp; videos</button>
      <button id="pickAny" class="big ghost">Send files</button>
    </div>
    <p class="hint" id="hint">You can send files to this computer.</p>
  </section>

  <section id="queue" class="queue" hidden></section>

  <section id="sentSection" hidden>
    <div class="section-head"><h2>Sent <span id="sentCount" class="muted"></span></h2></div>
    <ul id="sent" class="sent-list"></ul>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
